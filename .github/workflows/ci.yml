name: CI

# Every push and every pull request. Master Plan §6: `main` always works, and
# a branch cannot merge unless this is green.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same ref makes the older run irrelevant — cancel it rather
# than burn minutes finishing work nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck → lint → test → build → docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Must precede setup-node: the pnpm cache below needs a working pnpm,
      # and corepack is what provides it (version pinned by `packageManager`).
      - name: Enable corepack (provides pnpm)
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml disagrees with package.json,
      # so CI can never silently install different versions than we develop on.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gates, in order. Each is a separate step so a failure names itself
      # in the GitHub UI instead of hiding inside one long log.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fails on an exported symbol with no TSDoc comment, or a broken {@link}.
      - name: Doc coverage
        run: pnpm run docs

  # A real browser against the real build. Kept as its own job rather than folded
  # into `pnpm check`: it needs a browser download, and a failure here should say
  # "the app is broken" rather than hiding among unit tests. It does not depend on
  # `quality`, so both run at once and a broken build is reported either way.
  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Enable corepack (provides pnpm)
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The client imports the other packages from their `dist`, so they have to
      # exist before Playwright's own `vite build` step can resolve them.
      - name: Build the workspace
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @gaffer/web test:e2e:install

      - name: Play a match in a browser
        run: pnpm --filter @gaffer/web test:e2e

      # Only on failure: a trace is large, and a green run has nothing to look at.
      - name: Keep the report when something broke
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
