name: Deploy

# The live site is a **pinned release**, not the tip of main.
#
# It used to be every green push to main, on the reasoning that a link lagging
# main by a forgotten deploy misrepresents the game. That was right while main
# and the tester build were the same thing. They are not any more: the alpha is
# frozen at a tag while work continues — multiplayer is being built behind a
# flag, and the next rules change will start the same way. A push to main must
# not be able to move the ground under fifteen testers mid-wave.
#
# So main advances freely and the deploy only moves when somebody cuts a tag.
# `alpha-freeze-2` is what testers are playing; pushing `alpha-freeze-3` is what
# hands them the next one.
#
# One wrinkle worth knowing: a tag push runs the workflow **as it exists at that
# tag**, so this file has to be on main *before* the next freeze is cut for that
# freeze to deploy itself. Running it by hand always uses main's copy.
on:
  push:
    tags: ["alpha-freeze-*"]
  workflow_dispatch:
    inputs:
      ref:
        description: The release tag to publish.
        required: true
        default: alpha-freeze-2
        type: string

# The minimum Pages needs: read the code, write the site, and prove who we are.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight — a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the client
    runs-on: ubuntu-latest

    steps:
      # The pinned ref, never the branch this happened to run from. On a tag
      # push it is that tag; run by hand it is whatever was asked for.
      - name: Check out the release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Say what is being published
        run: |
          echo "ref:    ${{ inputs.ref || github.ref_name }}"
          echo "commit: $(git rev-parse HEAD)"
          echo "$(git log -1 --pretty=%s)"

      - name: Enable corepack (provides pnpm)
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the engine, shared and ai first — the client imports them from
      # their `dist`, so `--filter=@gaffer/web...` pulls the whole chain in.
      # Multiplayer is on in a deployed release and off everywhere else.
      #
      # These are repository **variables**, not secrets, and deliberately so:
      # the anon key is compiled into the bundle and is public by design — row
      # level security, not secrecy, is what stops one player writing to
      # another's match (docs/SECURITY.md). Masking it in logs would imply a
      # confidentiality it does not have and never had. The service-role key is
      # the one that must never come near this file.
      #
      # The flag-off build is still what CI's own job produces, so the
      # bundle-isolation gate keeps testing the thing it exists to test.
      - name: Build
        run: pnpm build --filter=@gaffer/web...
        env:
          VITE_ASYNC_MULTIPLAYER: "true"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # A release that says it has multiplayer and does not is worse than one
      # without it: the tester finds a dead link instead of a missing feature.
      - name: Check the release really carries multiplayer
        run: |
          if ! grep -rqi "supabase" apps/web/dist/assets/*.js; then
            echo "::error::the release was built without multiplayer"
            exit 1
          fi
          if ! grep -rqF "${{ vars.VITE_SUPABASE_URL }}" apps/web/dist/assets/*.js; then
            echo "::error::the release is not pointed at the Supabase project"
            exit 1
          fi
          echo "multiplayer is in the bundle and points at the project"

      # Pages serves 404.html for any path it does not have a file for. The app
      # keeps its whole state in the query string and never uses the path, so
      # this is only here to catch a link a chat client has mangled — it loads
      # the same app, which then reads the seed it was given.
      - name: Fall back to the app for unknown paths
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    name: publish
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
